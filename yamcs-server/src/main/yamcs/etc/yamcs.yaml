services:
- class: org.yamcs.http.HttpServer
  args:
    port: 8090
    address: 0.0.0.0
    cors:
      allowOrigin: '*'
      allowCredentials: false
dataDir: yamcs-data
instances:
- husky
secretKey: changeme
buckets:
- name: images_depth_cam_color
  path: /tmp/images_depth_cam_color
- name: images_oncommand_cam_color
  path: /tmp/images_oncommand_cam_color
- name: images_streaming_cam_color
  path: /tmp/images_streaming_cam_color
- name: images_depth_cam_left
  path: /tmp/images_depth_cam_left
- name: images_oncommand_cam_left
  path: /tmp/images_oncommand_cam_left
- name: images_streaming_cam_left
  path: /tmp/images_streaming_cam_left
- name: images_depth_cam_right
  path: /tmp/images_depth_cam_right
- name: images_oncommand_cam_right
  path: /tmp/images_oncommand_cam_right
- name: images_streaming_cam_right
  path: /tmp/images_streaming_cam_right
